<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balletje in de Cup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #87ceeb 0%, #d8f0fa 100%);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #game {
    position: relative;
    width: 100%;
    height: 100vh;
    cursor: pointer;
  }

  #hud {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  #level {
    font-size: 22px;
    font-weight: bold;
    color: #1a4a6b;
  }

  #uitleg {
    font-size: 14px;
    color: #33607f;
    margin-top: 4px;
  }

  /* Het bakje bovenin */
  #bakje {
    position: absolute;
    top: 70px;
    width: 90px;
    height: 45px;
    z-index: 5;
  }

  #bakje .schaal {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #e67e22, #b05c10);
    border-radius: 0 0 45px 45px;
    border: 3px solid #8a4a0e;
    border-top: 5px solid #8a4a0e;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
  }

  /* Het balletje */
  #bal {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8f8f, #e02020 70%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 4;
  }

  /* De cup onderin */
  #cup {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 90px;
    z-index: 5;
  }

  #cup .beker {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #3498db, #1c5f8f);
    clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
    border-radius: 4px;
  }

  #cup .rand {
    position: absolute;
    top: -6px;
    left: -5px;
    right: -5px;
    height: 12px;
    background: #2472a4;
    border-radius: 8px;
  }

  #bericht {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 3px 8px rgba(0,0,0,0.4);
    background: rgba(26, 74, 107, 0.85);
    padding: 24px 48px;
    border-radius: 16px;
    display: none;
    z-index: 20;
    text-align: center;
  }

  #bericht small {
    display: block;
    font-size: 18px;
    margin-top: 10px;
    font-weight: normal;
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="level">Level 1</div>
    <div id="uitleg">Klik op het juiste moment om het balletje te laten vallen!</div>
  </div>

  <div id="bakje"><div class="schaal"></div></div>
  <div id="bal"></div>
  <div id="cup"><div class="rand"></div><div class="beker"></div></div>

  <div id="bericht"></div>
</div>

<script>
(function () {
  const game = document.getElementById('game');
  const bakjeEl = document.getElementById('bakje');
  const balEl = document.getElementById('bal');
  const cupEl = document.getElementById('cup');
  const levelEl = document.getElementById('level');
  const berichtEl = document.getElementById('bericht');

  const BAL_SIZE = 26;
  const BAKJE_W = 90;

  let level = 1;
  let bakjeX = 0;
  let richting = 1;
  let snelheid = 3;            // wordt hoger per level
  let balVallend = false;
  let balX = 0, balY = 0, balVy = 0, balVx = 0;
  let wachtOpVolgendeRonde = false;

  // --- Geluid (Web Audio) ---
  let audioCtx = null;
  function zorgAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function speelToon(freq, startNa, duur, type, volume) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + startNa;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duur + 0.05);
  }

  // Vrolijk "ding-ding!" als het balletje in de cup valt
  function geluidRaak() {
    speelToon(523.25, 0,    0.15, 'sine', 0.25); // C5
    speelToon(659.25, 0.10, 0.15, 'sine', 0.25); // E5
    speelToon(783.99, 0.20, 0.30, 'sine', 0.25); // G5
  }

  // Kort "tok" bij een stuiter op de rand
  function geluidStuiter() {
    speelToon(320, 0, 0.07, 'triangle', 0.2);
  }

  function breedte() { return game.clientWidth; }
  function hoogte() { return game.clientHeight; }

  function resetBal() {
    balVallend = false;
    balEl.style.display = 'block';
  }

  function toonBericht(tekst, sub, kleur) {
    berichtEl.innerHTML = tekst + (sub ? '<small>' + sub + '</small>' : '');
    berichtEl.style.background = kleur;
    berichtEl.style.display = 'block';
  }

  function verbergBericht() {
    berichtEl.style.display = 'none';
  }

  function startLevel() {
    verbergBericht();
    levelEl.textContent = 'Level ' + level;
    snelheid = 3 + (level - 1) * 1.5;
    bakjeX = 10;
    richting = 1;
    wachtOpVolgendeRonde = false;
    resetBal();
  }

  function laatVallen() {
    if (balVallend || wachtOpVolgendeRonde) return;
    balVallend = true;
    balX = bakjeX + BAKJE_W / 2 - BAL_SIZE / 2;
    balY = 70 + 40; // net onder het bakje
    balVy = 0;
    balVx = 0;
  }

  // Stuiter op de rand van de cup: omhoog en opzij
  function stuiter(vx, cupTop) {
    balY = cupTop - BAL_SIZE;
    balVy = -Math.max(balVy * 0.45, 4);
    balVx = vx;
    geluidStuiter();
  }

  function raak() {
    wachtOpVolgendeRonde = true;
    balVallend = false;
    balEl.style.display = 'none';
    geluidRaak();
    toonBericht('🎉 Level ' + level + ' gehaald!', 'Klik voor level ' + (level + 1), 'rgba(39, 174, 96, 0.9)');
  }

  function mis() {
    wachtOpVolgendeRonde = true;
    balVallend = false;
    balEl.style.display = 'none';
    toonBericht('😞 Mis!', 'Klik om het opnieuw te proberen', 'rgba(192, 57, 43, 0.9)');
  }

  game.addEventListener('pointerdown', function () {
    zorgAudio();
    if (wachtOpVolgendeRonde) {
      if (berichtEl.textContent.indexOf('gehaald') !== -1) level++;
      startLevel();
      return;
    }
    laatVallen();
  });

  let vorigeTijd = null;

  function update(tijd) {
    // Delta-tijd zodat het spel op elke schermfrequentie even snel loopt
    if (vorigeTijd === null) vorigeTijd = tijd;
    const dt = Math.min((tijd - vorigeTijd) / (1000 / 60), 3); // in "60fps-frames", max 3
    vorigeTijd = tijd;

    // Bakje beweegt heen en weer
    if (!wachtOpVolgendeRonde) {
      bakjeX += snelheid * richting * dt;
      if (bakjeX <= 0) { bakjeX = 0; richting = 1; }
      if (bakjeX >= breedte() - BAKJE_W) { bakjeX = breedte() - BAKJE_W; richting = -1; }
      bakjeEl.style.left = bakjeX + 'px';
    }

    if (balVallend) {
      const vorigeBalOnder = balY + BAL_SIZE;
      balVy += 0.45 * dt;      // zwaartekracht
      balY += balVy * dt;
      balX += balVx * dt;

      balEl.style.left = balX + 'px';
      balEl.style.top = balY + 'px';

      // Positie van de cup-opening
      const cupRect = cupEl.getBoundingClientRect();
      const gameRect = game.getBoundingClientRect();
      const cupTop = cupRect.top - gameRect.top;
      const cupLinks = cupRect.left - gameRect.left;
      const cupRechts = cupLinks + cupRect.width;

      const balMidden = balX + BAL_SIZE / 2;
      const balOnder = balY + BAL_SIZE;

      const RAND = 16; // breedte van de randzone waar de bal op kan stuiteren

      // Bal passeert vallend de bovenkant van de cup (ook bij hoge snelheid)
      if (balVy > 0 && vorigeBalOnder < cupTop + 15 && balOnder >= cupTop) {
        if (balMidden > cupLinks + RAND && balMidden < cupRechts - RAND) {
          // Midden in de opening: raak!
          raak();
        } else if (balMidden >= cupLinks - 6 && balMidden <= cupLinks + RAND) {
          // Linkerrand: binnenkant stuitert naar binnen, buitenkant ernaast
          const binnenkant = balMidden > cupLinks + RAND / 2;
          stuiter(binnenkant ? 2.2 : -3, cupTop);
        } else if (balMidden >= cupRechts - RAND && balMidden <= cupRechts + 6) {
          // Rechterrand
          const binnenkant = balMidden < cupRechts - RAND / 2;
          stuiter(binnenkant ? -2.2 : 3, cupTop);
        }
      }

      // Bal valt onder het scherm: mis
      if (balVallend && balY > hoogte()) {
        mis();
      }
    } else if (!wachtOpVolgendeRonde) {
      // Bal zit in het bakje en beweegt mee
      balEl.style.left = (bakjeX + BAKJE_W / 2 - BAL_SIZE / 2) + 'px';
      balEl.style.top = '78px';
    }

    requestAnimationFrame(update);
  }

  startLevel();
  update();
})();
</script>
</body>
</html>
